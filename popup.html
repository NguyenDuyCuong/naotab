<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>naoTab</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🗂️ naoTab</h1>
      <div class="header-actions">
        <button id="btn-open-kb" title="Mở Brain Visualize">🧠 Brain Visualize</button>
        <button id="btn-open-settings" title="Settings">⚙️</button>
        <button id="btn-reload-ext" title="Reload extension">🔄</button>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search tabs..." />
      <span id="tab-count" class="tab-count-inline">0</span>
    </div>

    <div class="toolbar">
      <button id="btn-save-current" class="btn-save-current" title="Lưu tab đang xem vào Knowledge Base">💾 Tab này</button>
      <button id="btn-copy-all" title="Copy tất cả dạng text">📋 Copy</button>
      <button id="btn-copy-json">{ } JSON</button>
      <button id="btn-copy-markdown">🔗 Markdown</button>
      <button id="btn-export-csv">📥 CSV</button>
    </div>

    <div id="tab-list" class="tab-list"></div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Save Modal -->
  <div id="save-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <div id="modal-favicon" class="modal-favicon">🌐</div>
        <div class="modal-title-wrap">
          <div id="modal-title" class="modal-title"></div>
          <div id="modal-url" class="modal-url"></div>
        </div>
      </div>

      <!-- AI suggest button — chỉ hiện khi AI bật -->
      <div id="modal-ai-row" class="modal-ai-row hidden">
        <button id="btn-ai-suggest" class="btn-ai">✨ AI Suggest</button>
        <span id="ai-suggest-status" class="ai-status"></span>
      </div>

      <div class="modal-field">
        <label>Summary <span class="label-hint" id="summary-hint">(AI will fill if enabled)</span></label>
        <textarea id="modal-summary" placeholder="Short summary of this page..." rows="2"></textarea>
      </div>

      <div class="modal-field">
        <label>Why did you save this? <span class="label-hint">(optional)</span></label>
        <textarea id="modal-reason" placeholder="e.g. great OAuth implementation, need to read the middleware section..." rows="2"></textarea>
      </div>

      <div class="modal-field">
        <label>Tags <span class="label-hint">(click to remove, type to add)</span></label>
        <div id="modal-tags" class="tags-container"></div>
        <input type="text" id="modal-tag-input" placeholder="Add tag..." />
      </div>

      <div class="modal-footer">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-save" class="btn-primary">💾 Save</button>
      </div>
    </div>
  </div>

  <script src="core/schema.js"></script>
  <script src="core/storage.js"></script>
  <script src="core/ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
